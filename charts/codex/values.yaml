# Default values for codex.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Override chart name
nameOverride: ""

# Override chart full name
fullnameOverride: ""

# Replicas
replica:
  # Replicas count
  count: 50

# StatefulSet
statefulSet:
  # First replica index
  ordinalsStart: 1
  # For single replica we will skip replica index in the StatefulSet name
  # and it is useful only when no more than one replica is planned to be deployed
  # otherwise, when replica will be increased > 1, previous StatefulSet will be deleted
  # and new ones with index in the names will be created
  # this is why by default we set it to false, to avoid destructive transition
  #        name     StatefulSet
  # true:  codex --> codex
  # false: codex --> codex-1
  prettify: false

image:
  # Image repository
  repository: codexstorage/nim-codex
  # Image tag
  tag: 0.2.1
  # Image pull policy
  pullPolicy: IfNotPresent

# Image pull secrets
imagePullSecrets: []

# Lifecycle
lifecycle: {}

# Namespace
namespaceOverride: ""

# StatefulSet labels
labels: {}
  # foo: bar

# StatefulSet annotations
annotations: {}
  # foo: bar

# ServiceAccount is required for init-env container to get node External IP
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  rbac:
    # Specifies whether RBAC resources should be created
    create: true
    # rbac specific annotations
    annotations: {}
      # foo: bar
    # rbac specific labels
    labels: {}
      # foo: bar
    # Get node External IP
    clusterRules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list", "watch"]
    # Get service NodePort - not use currently
    rules:
      # - apiGroups: [""]
      #   resources: ["services"]
      #   verbs: ["get", "list", "watch"]

# Pod labels
podLabels: {}
  # foo: bar

# Pod annotations
podAnnotations: {}
  # foo: bar

podSecurityContext: {}
  # fsGroup: 1000
  # runAsGroup: 1000
  # runAsUser: 1000
  # runAsNonRoot: true

securityContext: {}
  # capabilities:
