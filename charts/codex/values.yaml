    # CODEX_BOOTSTRAP: ""
    CODEX_NAT: "extip:159.196.192.211"
    CODEX_LISTEN_ADDRS: /ip4/0.0.0.0/tcp/8070
    CODEX_DISC_IP: 0.0.0.0
    CODEX_DISC_PORT: 8090
    #
    # Storage
    CODEX_DATA_DIR: /data
    # b, k/kb, m/mb, g/gb, t/tb, p/pb
