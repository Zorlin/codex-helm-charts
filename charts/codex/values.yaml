  # Marketplace storage for sale configuration
  # We use postStart lifecycle hook to setup Codex node marketplace configuration via API
  # mutually exclusive with the lifecycle configuration bellow
  marketplace:
    totalSize: "9900000000000"
    duration: "604800"
    minPricePerBytePerSecond: "1"
    totalCollateral: "9999999999999999"

# Init container to pass environment variables dynamically to each replica
initEnv:
  image:
    # Image repository
    repository: bitnami/kubectl
    # Image tag
    tag: latest
    # Image pull policy
    pullPolicy: IfNotPresent
  # Enable init Env container - enabled automatically when replica.count > 1 and service.type.nodeport
  enabled: false
  command: ""
  # command: >-
  #     echo test
  # Disable this if we are not using the initcontainer
  envPath: /opt/env

# Pod ports
ports:
  api:
    enabled: true
    name: api
    containerPort: 8080
  metrics:
    enabled: true
    name: metrics
    containerPort: 8008
  transport:
    enabled: true
    name: libp2p
    containerPort: 8070
  discovery:
    enabled: true
    name: dht
    containerPort: 8090

# Service
service:
  # Service type to deploy - nodeport is required when Codex node should be reachable from the Internet
  type:
    - service
    - nodeport
  # Prettify service name
  # single StatefulSet
  # true:  codex-service   codex-nodeport
  # false: codex-1-service codex-1-nodeport
  # multiple StatefulSets
  # true:  codex-1-service   codex-1-nodeport   codex-2-service   codex-2-nodeport
  # false: codex-1-1-service codex-1-1-nodeport codex-2-1-service codex-2-1-nodeport
  prettify: true
  # API port
  api:
    enabled: true
    port: 8080
  # Metrics port
  metrics:
    enabled: true
    port: 8008
  # Transport port
  transport:
    enabled: true
    # 30000-32767
    nodePort: 30510
    nodePortOffset: 10
  # Discovery port
  discovery:
    enabled: true
    # 30000-32767
    nodePort: 30510
    nodePortOffset: 10

# Extra container ports
extraContainerPorts: []
  # - name: foo
  #   containerPort: 1234
  #   protocol: TCP

# Extra ports
extraPorts: []
  # - name: foo
  #   port: 1234
  #   protocol: TCP

# Ingress for Codex API
ingress:
  # Enable ingress
  enabled: true
  # Override chart full name
  fullnameOverride: ""
  # Ingress class
  class: traefik
  prettify: false
  # Ingress annotations
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "codex-ns-auth@kubernetescrd"
    cert-manager.io/cluster-issuer: "acme-prod"
  tls:
    - secretName: codex-riff-cc
      hosts:
        - codex.riff.cc
  hosts:
    - host: codex.riff.cc
      paths:
        # When podName is blank, URL will use deployed Pod name
        # https://codex.riff.cc/pod-name-1
        # https://codex.riff.cc/pod-name-2
        - path: /
          rewritePath: (/|$)(.*)
          pathType: Prefix
        # When podName is set, in URL we will use that value instead of the deployed Pod name
        # When prettify is set to false, Pod URI will contain the StatefulSet Pod index
        # leadingZeros specify the number of digits in the endpoint Pod name - pod-name-1/01/001
        # https://codex.riff.cc/endpoints/node-01-1
        # https://codex.riff.cc/endpoints/node-02-1
        - path: /storage
          rewritePath: (/|$)(.*)
          pathType: Prefix
          podName: node
          prettify: false
          leadingZeros: 2

# Pod resources
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Startup probe
startupProbe: {}

# Liveness probe
livenessProbe:
  httpGet:
    path: /api/codex/v1/debug/info
    port: '{{ .Values.ports.api.name }}'
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 1200

# Readiness probe
readinessProbe:
  httpGet:
    path: /api/codex/v1/debug/info
    port: '{{ .Values.ports.api.name }}'
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 1200

# Persistence
persistence:
  # Enable persistence using Persistent Volume Claims
  enabled: true
  # Name prefix for Persistent Volume Claims
  name: codex-pvc
  # Use an existing PVC to persist data
  existingClaim: "codex-pvc"
  # Access mode of data volume
  accessModes:
    - ReadWriteMany
  # Size of data volume
  size: 1Pi
  # Storage class of data volume
  storageClassName: "moosefs-storage"
  # Annotations for volume claim template
  annotations: {}
  #  foo: bar
  # Selector for volume claim template
  selector: {}
  #   matchLabels:
  #     foo: bar
  retentionPolicy:
    whenDeleted: Retain

# Additional volumes on the output Deployment definition.
volumes:
- name: codex-eth-private-key
  secret:
    secretName: codex-eth-private-key
    optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

initContainers: []
