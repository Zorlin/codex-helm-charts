    # file name `codex-eth-private-key` will be used as a secret name to be mounted to the Pod
    CODEX_ETH_PRIVATE_KEY: /opt/codex-eth-private-key
    CODEX_MARKETPLACE_ADDRESS: 0xDB2908d724a15d05c0B6B8e8441a8b36E67476d3
    # CODEX_CIRCUIT_DIR: /data/circuits
    CODEX_CIRCOM_R1CS: /data/circuits/proof_main.r1cs
    CODEX_CIRCOM_WASM: /data/circuits/proof_main.wasm
    CODEX_CIRCOM_ZKEY: /data/circuits/proof_main.zkey

