    # s, m, h, d, w
    # CODEX_BLOCK_TTL: 1d
    # CODEX_BLOCK_MI: 10m
    # CODEX_BLOCK_MN: 1000
    #
    # Persistence
    CODEX_PERSISTENCE: true
    CODEX_ETH_PROVIDER: https://rpc.testnet.codex.storage
