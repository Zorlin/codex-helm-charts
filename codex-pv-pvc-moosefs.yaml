---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: codex-pv
  namespace: codex-ns
spec:
  storageClassName: ""               # empty Storage Class
  capacity:
    storage: 1Pi                     # required, however does not have any effect
  accessModes:
    - ReadWriteMany
  csi:
    driver: csi.moosefs.com
    volumeHandle: codex-moosefs   # unique volume name
    volumeAttributes:
      mfsSubDir: "/services/codex"                 # subdirectory to be mounted as a rootdir (inside k8s_root_dir)
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: codex-pvc
  namespace: codex-ns
spec:
  storageClassName: ""               # empty Storage Class
  volumeName: codex-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Pi                   # at least as much as in PV, does not have any effect
